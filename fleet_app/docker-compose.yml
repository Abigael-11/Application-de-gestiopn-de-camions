version: "3.8"

services:
  db:
    image: postgres:16
    container_name: fleet_db
    restart: always
    environment:
      POSTGRES_USER: fleet_user
      POSTGRES_PASSWORD: fleet_pass
      POSTGRES_DB: fleet_db
    ports:
      - "5432:5432"
    volumes:
      - fleet_pgdata:/var/lib/postgresql/data

volumes:
  fleet_pgdata:
