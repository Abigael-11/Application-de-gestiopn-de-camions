<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Connexion — Fleet Ops</title>
<link rel="stylesheet" href="css/style.css" />
<style>
  body { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
  .login-box { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 32px; width: 360px; }
  .login-brand { display: flex; align-items: center; gap: 10px; margin-bottom: 26px; }
  .login-title { font-size: 17px; font-weight: 700; margin: 0 0 6px; }
  .login-sub { font-size: 12.5px; color: var(--text-secondary); margin: 0 0 22px; }
</style>
</head>
<body>

<div class="login-box">
  <div class="login-brand">
    <div class="brand-icon">🚚</div>
    <div><div class="brand-name">FLEET OPS</div><div class="brand-sub">Suivi de flotte</div></div>
  </div>
  <p class="login-title">Connexion</p>
  <p class="login-sub">Accédez au tableau de bord de la flotte.</p>

  <div class="modal-error" id="loginError"></div>

  <form id="loginForm">
    <div class="field">
      <label for="identifiant">Identifiant</label>
      <input type="text" id="identifiant" autocomplete="username" required />
    </div>
    <div class="field">
      <label for="motDePasse">Mot de passe</label>
      <input type="password" id="motDePasse" autocomplete="current-password" required />
    </div>
    <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;margin-top:6px;" id="btnLogin">Se connecter</button>
  </form>
</div>

<script src="js/api.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
